name: AIFC SAL v1.17 External Bootstrap Ratification Admissibility Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v117-external-bootstrap-ratification-admissibility-boundary:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and immutable v1.16 predecessor tree
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e b8a1f3acf9d8444affccdb6b0b754f19e6a08949^{commit}
          test "$(git rev-parse b8a1f3acf9d8444affccdb6b0b754f19e6a08949^{tree})" = "9534c147ba29cc53f7f321b4101907a04818c3bc"
          echo "SAL_V117_PREDECESSOR_TREE = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Capture admissibility implementation identity
        shell: bash
        run: |
          mkdir -p sal-external-bootstrap-ratification-admissibility-evidence
          impl=reference/verifier/external_bootstrap_ratification_admissibility_v1.py
          echo "EXTERNAL_BOOTSTRAP_RATIFICATION_ADMISSIBILITY_IMPLEMENTATION_PATH = $impl" | tee sal-external-bootstrap-ratification-admissibility-evidence/implementation-identity.txt
          echo "EXTERNAL_BOOTSTRAP_RATIFICATION_ADMISSIBILITY_IMPLEMENTATION_GIT_BLOB_SHA1 = $(git hash-object "$impl")" | tee -a sal-external-bootstrap-ratification-admissibility-evidence/implementation-identity.txt
          echo "EXTERNAL_BOOTSTRAP_RATIFICATION_ADMISSIBILITY_IMPLEMENTATION_RAW_SHA256 = $(sha256sum "$impl" | awk '{print $1}')" | tee -a sal-external-bootstrap-ratification-admissibility-evidence/implementation-identity.txt

      - name: Run SAL v1.17 adversarial unit module
        shell: bash
        run: |
          python -m unittest discover -s reference/tests -p 'test_sal_external_bootstrap_ratification_admissibility_v117.py' -v 2>&1 | tee sal-external-bootstrap-ratification-admissibility-evidence/sal-v117-unit-tests.txt

      - name: Run attested SAL v1.17 admissibility checker
        shell: bash
        run: |
          python reference/verifier/sal_external_bootstrap_ratification_admissibility_checker_v117.py | tee sal-external-bootstrap-ratification-admissibility-evidence/sal-external-bootstrap-ratification-admissibility-v117.txt
          sha256sum sal-external-bootstrap-ratification-admissibility-evidence/sal-external-bootstrap-ratification-admissibility-v117.txt | tee sal-external-bootstrap-ratification-admissibility-evidence/sal-external-bootstrap-ratification-admissibility-v117.sha256

      - name: Upload SAL v1.17 admissibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v117-external-bootstrap-ratification-admissibility-${{ github.run_id }}
          path: sal-external-bootstrap-ratification-admissibility-evidence/
          if-no-files-found: error
          retention-days: 90
