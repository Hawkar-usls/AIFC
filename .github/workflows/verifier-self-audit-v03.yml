# DIAGNOSTIC ONLY — NOT A VERIFIER PASS WORKFLOW.
name: AIFC Verifier v0.4 Hash-Lock Probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hash_lock_probe:
    name: v0.4 hash-lock parser and runtime probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install hash-locked verifier runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt
      - name: Preserve diagnostic ceiling
        run: |
          echo "HASH_LOCK_PROBE_ONLY = TRUE"
          echo "VERIFIER_V04_PASS = NOT_EVALUATED"
          echo "IMPLEMENTATION_A_PASS = NOT_ESTABLISHED"
          echo "AIFC_V1_FROZEN = FALSE"
