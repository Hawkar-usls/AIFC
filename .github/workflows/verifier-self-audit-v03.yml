name: AIFC Verifier Self-Audit v0.3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verifier-self-audit:
    name: Verifier A self-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verifier runtime dependencies
        run: python -m pip install --disable-pip-version-check -r reference/verifier/requirements.txt

      - name: Capture base repository conformance
        shell: bash
        run: |
          mkdir -p ci-evidence
          set +e
          python tools/check_repo_conformance.py > ci-evidence/base-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/base-conformance.txt
          echo "$code" > ci-evidence/base-conformance.exit
          exit 0

      - name: Capture preregistration conformance
        shell: bash
        run: |
          set +e
          python tools/check_preregistration_conformance.py > ci-evidence/preregistration-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/preregistration-conformance.txt
          echo "$code" > ci-evidence/preregistration-conformance.exit
          exit 0

      - name: Capture self-audit conformance
        shell: bash
        run: |
          set +e
          python tools/check_self_audit_conformance.py > ci-evidence/self-audit-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/self-audit-conformance.txt
          echo "$code" > ci-evidence/self-audit-conformance.exit
          exit 0

      - name: Capture complete Verifier A unit-test report
        shell: bash
        run: |
          set +e
          python -m unittest discover -s reference/tests -v > ci-evidence/unittest.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/unittest.txt
          echo "$code" > ci-evidence/unittest.exit
          exit 0

      - name: Resolve numeric GitHub Actions job id
        id: jobmeta
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOB_NAME: Verifier A self-audit
        shell: bash
        run: |
          job_id=$(python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          matches = [j for j in data.get("jobs", []) if j.get("name") == os.environ["EXPECTED_JOB_NAME"]]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one current job, found {len(matches)}")
          print(matches[0]["id"])
          PY
          )
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "CURRENT_JOB_ID=$job_id"

      - name: Build proof-carrying CI attestation
        run: |
          python tools/build_verifier_ci_attestation.py \
            --workflow-path .github/workflows/verifier-self-audit-v03.yml \
            --base-report ci-evidence/base-conformance.txt \
            --base-exit ci-evidence/base-conformance.exit \
            --prereg-report ci-evidence/preregistration-conformance.txt \
            --prereg-exit ci-evidence/preregistration-conformance.exit \
            --self-audit-report ci-evidence/self-audit-conformance.txt \
            --self-audit-exit ci-evidence/self-audit-conformance.exit \
            --unittest-report ci-evidence/unittest.txt \
            --unittest-exit ci-evidence/unittest.exit \
            --job-id '${{ steps.jobmeta.outputs.job_id }}' \
            --job-name 'Verifier A self-audit' \
            --output-dir ci-evidence

      - name: Self-verify CI attestation against exact checkout
        run: |
          python tools/verify_verifier_ci_attestation.py \
            --attestation ci-evidence/verifier-ci-attestation.json \
            --artifact-dir ci-evidence \
            --sidecar ci-evidence/verifier-ci-attestation.sha256.json

      - name: Upload proof-carrying CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-a-v03-ci-attestation-${{ github.run_id }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce attested test result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names = [
              "base-conformance.exit",
              "preregistration-conformance.exit",
              "self-audit-conformance.exit",
              "unittest.exit",
          ]
          exits = {name: int((Path("ci-evidence") / name).read_text().strip()) for name in names}
          att = json.loads(Path("ci-evidence/verifier-ci-attestation.json").read_text())
          print("ATTESTED_EXIT_CODES =", exits)
          print("ATTESTED_OVERALL_STATUS =", att["overall_status"])
          print("ATTESTED_TEST_COUNT =", att["reports"]["unittest"]["test_count"])
          print("IMPLEMENTATION_A_PASS = NOT_ESTABLISHED")
          print("AIFC_V1_FROZEN = FALSE")
          if any(exits.values()) or att["overall_status"] != "PASS":
              raise SystemExit(1)
          PY
