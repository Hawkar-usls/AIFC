# DIAGNOSTIC ONLY — NOT A VERIFIER PASS WORKFLOW.
# This commit exists solely to prove whether GitHub accepts the registered workflow locator after v0.4 migration.
name: AIFC Verifier v0.4 Parser Probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser_probe:
    name: v0.4 workflow parser probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Parser boundary probe only
        run: |
          echo "WORKFLOW_DEFINITION_PLATFORM_ACCEPTED = TRUE"
          echo "VERIFIER_V04_PASS = NOT_EVALUATED"
          echo "IMPLEMENTATION_A_PASS = NOT_ESTABLISHED"
          echo "AIFC_V1_FROZEN = FALSE"
