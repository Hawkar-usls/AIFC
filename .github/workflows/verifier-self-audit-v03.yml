# Historical filename retained as the already-registered pull-request workflow locator.
# Active semantics are v0.4 and are bound by exact workflow bytes/hash in the CI attestation.
name: AIFC Verifier Environment Self-Audit v0.4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verifier-self-audit:
    name: Verifier A environment self-audit
    runs-on: ubuntu-24.04
    outputs:
      tested_source_commit_sha: ${{ steps.attmeta.outputs.tested_source_commit_sha }}
      verifier_job_id: ${{ steps.jobmeta.outputs.job_id }}
      attestation_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      attestation_raw_sha256: ${{ steps.attmeta.outputs.attestation_raw_sha256 }}
      attestation_protocol_hash: ${{ steps.attmeta.outputs.attestation_protocol_hash }}
    steps:
      - name: Checkout exact tested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Install hash-locked verifier runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Capture execution environment evidence
        shell: bash
        run: |
          mkdir -p ci-evidence
          cp /etc/os-release ci-evidence/os-release.txt
          uname -a > ci-evidence/uname.txt
          dpkg-query -W -f='${Package}=${Version}\n' | LC_ALL=C sort > ci-evidence/system-packages.txt
          python -m pip freeze --all | LC_ALL=C sort > ci-evidence/pip-freeze.txt
          python tools/build_execution_environment_manifest.py \
            --artifact-dir ci-evidence \
            --os-release ci-evidence/os-release.txt \
            --uname ci-evidence/uname.txt \
            --system-packages ci-evidence/system-packages.txt \
            --pip-freeze ci-evidence/pip-freeze.txt \
            --action actions/checkout=11d5960a326750d5838078e36cf38b85af677262 \
            --action actions/setup-python=a26af69be951a213d495a4c3e4e4022e16d87065 \
            --action actions/upload-artifact=ea165f8d65b6e75b540449e92b4886f43607fa02

      - name: Capture base repository conformance
        shell: bash
        run: |
          set +e
          python tools/check_repo_conformance.py > ci-evidence/base-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/base-conformance.txt
          printf '%s\n' "$code" > ci-evidence/base-conformance.exit
          exit 0

      - name: Capture preregistration conformance
        shell: bash
        run: |
          set +e
          python tools/check_preregistration_conformance.py > ci-evidence/preregistration-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/preregistration-conformance.txt
          printf '%s\n' "$code" > ci-evidence/preregistration-conformance.exit
          exit 0

      - name: Capture environment self-audit conformance
        shell: bash
        run: |
          set +e
          python tools/check_self_audit_conformance.py > ci-evidence/self-audit-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/self-audit-conformance.txt
          printf '%s\n' "$code" > ci-evidence/self-audit-conformance.exit
          exit 0

      - name: Capture complete Verifier A unit-test report
        shell: bash
        run: |
          set +e
          python -m unittest discover -s reference/tests -v > ci-evidence/unittest.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/unittest.txt
          printf '%s\n' "$code" > ci-evidence/unittest.exit
          exit 0

      - name: Resolve numeric GitHub Actions verifier job id
        id: jobmeta
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOB_NAME: Verifier A environment self-audit
        shell: bash
        run: |
          job_id=$(python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          matches = [j for j in data.get("jobs", []) if j.get("name") == os.environ["EXPECTED_JOB_NAME"]]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one current verifier job, found {len(matches)}")
          print(matches[0]["id"])
          PY
          )
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "CURRENT_VERIFIER_JOB_ID=$job_id"

      - name: Build proof-carrying Verifier CI Attestation v2
        run: |
          python tools/build_verifier_ci_attestation_v04.py \
            --workflow-path .github/workflows/verifier-self-audit-v03.yml \
            --environment-manifest ci-evidence/execution-environment-manifest.json \
            --base-report ci-evidence/base-conformance.txt \
            --base-exit ci-evidence/base-conformance.exit \
            --prereg-report ci-evidence/preregistration-conformance.txt \
            --prereg-exit ci-evidence/preregistration-conformance.exit \
            --self-audit-report ci-evidence/self-audit-conformance.txt \
            --self-audit-exit ci-evidence/self-audit-conformance.exit \
            --unittest-report ci-evidence/unittest.txt \
            --unittest-exit ci-evidence/unittest.exit \
            --job-id '${{ steps.jobmeta.outputs.job_id }}' \
            --job-name 'Verifier A environment self-audit' \
            --output-dir ci-evidence

      - name: Expose attestation bindings to post-upload job
        id: attmeta
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          att = json.loads(Path("ci-evidence/verifier-ci-attestation-v2.json").read_text())
          side = json.loads(Path("ci-evidence/verifier-ci-attestation-v2.sha256.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tested_source_commit_sha={att['tested_source_commit_sha']}\n")
              f.write(f"attestation_raw_sha256={side['raw_sha256']}\n")
              f.write(f"attestation_protocol_hash={side['protocol_content_hash']}\n")
          PY

      - name: Independently replay CI attestation semantics
        run: |
          python tools/verify_verifier_ci_attestation_v04.py \
            --attestation ci-evidence/verifier-ci-attestation-v2.json \
            --artifact-dir ci-evidence \
            --sidecar ci-evidence/verifier-ci-attestation-v2.sha256.json

      - name: Upload proof-carrying verifier evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-a-v04-ci-attestation-${{ github.run_id }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce attested verifier result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          att = json.loads(Path("ci-evidence/verifier-ci-attestation-v2.json").read_text())
          print("ATTESTED_OVERALL_STATUS =", att["overall_status"])
          print("DECLARED_TEST_COUNT =", att["reports"]["unittest"]["declared_test_count"])
          print("IMPLEMENTATION_A_PASS = NOT_ESTABLISHED")
          print("AIFC_V1_FROZEN = FALSE")
          if att["overall_status"] != "PASS":
              raise SystemExit(1)
          PY

  platform-receipt:
    name: GitHub platform receipt replay
    needs: verifier-self-audit
    if: ${{ needs.verifier-self-audit.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verifier-self-audit.outputs.tested_source_commit_sha }}
          fetch-depth: 1

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Install hash-locked verifier runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Build post-upload CI platform receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p platform-evidence
          python tools/build_ci_platform_receipt.py \
            --run-id '${{ github.run_id }}' \
            --job-id '${{ needs.verifier-self-audit.outputs.verifier_job_id }}' \
            --artifact-id '${{ needs.verifier-self-audit.outputs.attestation_artifact_id }}' \
            --tested-source-commit '${{ needs.verifier-self-audit.outputs.tested_source_commit_sha }}' \
            --attestation-raw-sha256 '${{ needs.verifier-self-audit.outputs.attestation_raw_sha256 }}' \
            --attestation-protocol-hash '${{ needs.verifier-self-audit.outputs.attestation_protocol_hash }}' \
            --output-dir platform-evidence

      - name: Re-query GitHub and verify uploaded artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/verify_ci_platform_receipt.py \
            --receipt platform-evidence/ci-platform-receipt.json \
            --sidecar platform-evidence/ci-platform-receipt.sha256.json

      - name: Upload platform receipt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-a-v04-platform-receipt-${{ github.run_id }}
          path: platform-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve claim ceiling
        run: |
          echo "CI_PLATFORM_PROVENANCE_BINDING = CANDIDATE_PASS_IF_PREVIOUS_STEP_GREEN"
          echo "PLATFORM_TRUST_PROVEN = FALSE"
          echo "IMPLEMENTATION_A_PASS = NOT_ESTABLISHED"
          echo "AIFC_V1_FROZEN = FALSE"
