# DIAGNOSTIC ONLY — NOT A VERIFIER PASS WORKFLOW.
name: AIFC Verifier v0.4 Attestation Build Probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  attestation_build_probe:
    name: Verifier A environment self-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install hash-locked verifier runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt
      - name: Capture execution environment evidence
        shell: bash
        run: |
          mkdir -p ci-evidence
          cp /etc/os-release ci-evidence/os-release.txt
          uname -a > ci-evidence/uname.txt
          dpkg-query -W -f='${Package}=${Version}\n' | LC_ALL=C sort > ci-evidence/system-packages.txt
          python -m pip freeze --all | LC_ALL=C sort > ci-evidence/pip-freeze.txt
          python tools/build_execution_environment_manifest.py \
            --artifact-dir ci-evidence \
            --os-release ci-evidence/os-release.txt \
            --uname ci-evidence/uname.txt \
            --system-packages ci-evidence/system-packages.txt \
            --pip-freeze ci-evidence/pip-freeze.txt \
            --action actions/checkout=11d5960a326750d5838078e36cf38b85af677262 \
            --action actions/setup-python=a26af69be951a213d495a4c3e4e4022e16d87065 \
            --action actions/upload-artifact=ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: Capture base repository conformance
        shell: bash
        run: |
          set +e
          python tools/check_repo_conformance.py > ci-evidence/base-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/base-conformance.txt
          printf '%s\n' "$code" > ci-evidence/base-conformance.exit
          exit 0
      - name: Capture preregistration conformance
        shell: bash
        run: |
          set +e
          python tools/check_preregistration_conformance.py > ci-evidence/preregistration-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/preregistration-conformance.txt
          printf '%s\n' "$code" > ci-evidence/preregistration-conformance.exit
          exit 0
      - name: Capture environment self-audit conformance
        shell: bash
        run: |
          set +e
          python tools/check_self_audit_conformance.py > ci-evidence/self-audit-conformance.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/self-audit-conformance.txt
          printf '%s\n' "$code" > ci-evidence/self-audit-conformance.exit
          exit 0
      - name: Capture complete Verifier A unit-test report
        shell: bash
        run: |
          set +e
          python -m unittest discover -s reference/tests -v > ci-evidence/unittest.txt 2>&1
          code=$?
          set -e
          cat ci-evidence/unittest.txt
          printf '%s\n' "$code" > ci-evidence/unittest.exit
          exit 0
      - name: Resolve numeric GitHub Actions verifier job id
        id: jobmeta
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOB_NAME: Verifier A environment self-audit
        shell: bash
        run: |
          job_id=$(python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          matches = [j for j in data.get("jobs", []) if j.get("name") == os.environ["EXPECTED_JOB_NAME"]]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one current verifier job, found {len(matches)}")
          print(matches[0]["id"])
          PY
          )
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "CURRENT_VERIFIER_JOB_ID=$job_id"
      - name: Build proof-carrying Verifier CI Attestation v2
        run: |
          python tools/build_verifier_ci_attestation_v04.py \
            --workflow-path .github/workflows/verifier-self-audit-v03.yml \
            --environment-manifest ci-evidence/execution-environment-manifest.json \
            --base-report ci-evidence/base-conformance.txt \
            --base-exit ci-evidence/base-conformance.exit \
            --prereg-report ci-evidence/preregistration-conformance.txt \
            --prereg-exit ci-evidence/preregistration-conformance.exit \
            --self-audit-report ci-evidence/self-audit-conformance.txt \
            --self-audit-exit ci-evidence/self-audit-conformance.exit \
            --unittest-report ci-evidence/unittest.txt \
            --unittest-exit ci-evidence/unittest.exit \
            --job-id '${{ steps.jobmeta.outputs.job_id }}' \
            --job-name 'Verifier A environment self-audit' \
            --output-dir ci-evidence
      - name: Preserve diagnostic ceiling
        run: |
          echo "ATTESTATION_BUILD_PROBE_ONLY = TRUE"
          echo "CI_PLATFORM_PROVENANCE_BINDING = NOT_EVALUATED"
          echo "IMPLEMENTATION_A_PASS = NOT_ESTABLISHED"
          echo "AIFC_V1_FROZEN = FALSE"
