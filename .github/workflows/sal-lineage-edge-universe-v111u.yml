name: AIFC SAL v1.11u Lineage Edge Universe Derivation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v111u-lineage-edge-universe:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and inherited v1.11h milestone
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 367dc30f53365225157dfb77e45fe6ef9ba027c8^{commit}
          test "$(git ls-tree HEAD -- conformance/AIFC-DERIVED-SEMANTIC-LINEAGE-EDGE-BINDING-v1.json | awk '{print $3}')" = "c5ccf513f826aae2e1115b65475f489f40232486"
          test "$(git ls-tree HEAD -- conformance/AIFC-DERIVED-SEMANTIC-LINEAGE-EDGE-AUDIT-v1.json | awk '{print $3}')" = "30ec3fa8d0060cac107dfc668b86710ab5ed2b17"
          echo "SAL_V111U_PARENT_V111H_MEMBERSHIP = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run attested SAL v1.11u edge-universe checker
        shell: bash
        run: |
          mkdir -p sal-lineage-edge-universe-evidence
          python reference/verifier/sal_lineage_edge_universe_checker_v111u.py | tee sal-lineage-edge-universe-evidence/sal-lineage-edge-universe-v111u.txt
          sha256sum sal-lineage-edge-universe-evidence/sal-lineage-edge-universe-v111u.txt | tee sal-lineage-edge-universe-evidence/sal-lineage-edge-universe-v111u.sha256

      - name: Upload SAL v1.11u edge-universe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v111u-lineage-edge-universe-${{ github.run_id }}
          path: sal-lineage-edge-universe-evidence/
          if-no-files-found: error
          retention-days: 90
