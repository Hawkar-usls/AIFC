name: AIFC SAL v1.13 Lineage Completeness Basis Authority Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v113-lineage-completeness-basis-authority:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and immutable v1.12 predecessor tree
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 356c8444218cdecdbb5bd89480967d31173d7fd5^{commit}
          test "$(git rev-parse 356c8444218cdecdbb5bd89480967d31173d7fd5^{tree})" = "098a6275fcb0ccfa21b874ff70a4f89f7c03a02b"
          echo "SAL_V113_PREDECESSOR_TREE = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Capture completeness-basis auditor implementation identity
        shell: bash
        run: |
          mkdir -p sal-lineage-completeness-basis-authority-evidence
          impl=reference/verifier/lineage_completeness_basis_authority_v1.py
          echo "COMPLETENESS_BASIS_AUDITOR_IMPLEMENTATION_PATH = $impl" | tee sal-lineage-completeness-basis-authority-evidence/auditor-implementation-identity.txt
          echo "COMPLETENESS_BASIS_AUDITOR_IMPLEMENTATION_GIT_BLOB_SHA1 = $(git hash-object "$impl")" | tee -a sal-lineage-completeness-basis-authority-evidence/auditor-implementation-identity.txt
          echo "COMPLETENESS_BASIS_AUDITOR_IMPLEMENTATION_RAW_SHA256 = $(sha256sum "$impl" | awk '{print $1}')" | tee -a sal-lineage-completeness-basis-authority-evidence/auditor-implementation-identity.txt

      - name: Run SAL v1.13 adversarial unit module
        shell: bash
        run: |
          python -m unittest discover -s reference/tests -p 'test_sal_lineage_completeness_basis_authority_v113.py' -v 2>&1 | tee sal-lineage-completeness-basis-authority-evidence/sal-v113-unit-tests.txt

      - name: Run attested SAL v1.13 completeness basis authority checker
        shell: bash
        run: |
          python reference/verifier/sal_lineage_completeness_basis_authority_checker_v113.py | tee sal-lineage-completeness-basis-authority-evidence/sal-lineage-completeness-basis-authority-v113.txt
          sha256sum sal-lineage-completeness-basis-authority-evidence/sal-lineage-completeness-basis-authority-v113.txt | tee sal-lineage-completeness-basis-authority-evidence/sal-lineage-completeness-basis-authority-v113.sha256

      - name: Upload SAL v1.13 completeness basis authority evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v113-lineage-completeness-basis-authority-${{ github.run_id }}
          path: sal-lineage-completeness-basis-authority-evidence/
          if-no-files-found: error
          retention-days: 90
