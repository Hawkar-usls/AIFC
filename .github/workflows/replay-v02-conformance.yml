name: AIFC Replay v0.2 Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-v02-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verifier runtime dependencies
        run: python -m pip install --disable-pip-version-check -r reference/verifier/requirements.txt

      - name: Run base repository conformance
        run: python tools/check_repo_conformance.py

      - name: Run preregistration and replay supplemental conformance
        run: python tools/check_preregistration_conformance.py

      - name: Run complete Verifier A test suite
        run: |
          python -m unittest discover -s reference/tests -v
          echo "CURRENT_RUN_EXPERIMENT_PLAN_PREREGISTRATION = PASS_IF_TESTS_GREEN"
          echo "CURRENT_RUN_ENTROPY_POLICY_REPLAY = PASS_IF_TESTS_GREEN"
          echo "CURRENT_RUN_VERIFIER_A_REPLAY = PASS_IF_TESTS_GREEN"
          echo "CURRENT_TREE_CI_PASS_REQUIRES_PROOF_CARRYING_ATTESTATION = TRUE"
          echo "IMPLEMENTATION_A_PASS = NOT_ESTABLISHED"
          echo "AIFC_V1_FROZEN = FALSE"

      - name: Block all v1.0 frozen tags in draft workflow
        if: startsWith(github.ref, 'refs/tags/v1.0')
        run: |
          echo "AIFC v1.0 frozen tag blocked by draft workflow."
          echo "Frozen release requires proof-carrying gate evidence, two independent"
          echo "implementations, byte-identical canonicalization, cryptographic witness/source"
          echo "verification and an external bench."
          exit 1
