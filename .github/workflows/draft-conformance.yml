name: AIFC Draft Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository-level conformance checks
        run: python tools/check_repo_conformance.py

      - name: Run Verifier A frontier and replay tests
        run: |
          python -m unittest discover -s reference/tests -v
          echo "VERIFIER_A_FRONTIER_CORE = PASS"
          echo "VERIFIER_A_REPLAY_V0_2 = PASS"
          echo "IMPLEMENTATION_A_PASS = NOT_ESTABLISHED"
          echo "AIFC_V1_FROZEN = FALSE"

      - name: Block premature v1.0 frozen tags
        if: startsWith(github.ref, 'refs/tags/v1.0')
        run: |
          echo "AIFC v1.0 frozen tag blocked."
          echo "A future frozen-release workflow must resolve and verify the out-of-tree"
          echo "AIFC/release-manifest/v1 and every required evidence hash; it must not trust"
          echo "conformance/AIFC-RELEASE-GATE-v1.json status as an authorization field."
          exit 1
