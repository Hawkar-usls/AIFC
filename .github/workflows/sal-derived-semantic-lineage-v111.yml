name: AIFC SAL v1.11 Derived Semantic Lineage Closure

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v111-derived-semantic-lineage-closure:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and inherited semantic sources
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 1ea4bf518c0392a80f0603026e490bf7a205276d^{commit}
          git cat-file -e 847529fa3c3cbf0a710b2726543634479fef266f^{commit}
          test "$(git ls-tree 847529fa3c3cbf0a710b2726543634479fef266f -- conformance/AIFC-PREDECESSOR-SEMANTIC-FORMULA-v1.json | awk '{print $3}')" = "81d70057c41dd8e5e7fe14d155a661dda5c901ff"
          test "$(git ls-tree 847529fa3c3cbf0a710b2726543634479fef266f -- conformance/AIFC-TARGET-SEMANTIC-FORMULA-v1.json | awk '{print $3}')" = "9f2f25aade7d899f3a6dc6c28bb544ab759105aa"
          echo "SAL_V111_HISTORICAL_SEMANTIC_FORMULA_MEMBERSHIP = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run attested SAL v1.11 derived semantic lineage checker
        shell: bash
        run: |
          mkdir -p sal-derived-semantic-lineage-evidence
          python reference/verifier/sal_derived_semantic_lineage_checker_v111.py | tee sal-derived-semantic-lineage-evidence/sal-derived-semantic-lineage-v111.txt
          sha256sum sal-derived-semantic-lineage-evidence/sal-derived-semantic-lineage-v111.txt | tee sal-derived-semantic-lineage-evidence/sal-derived-semantic-lineage-v111.sha256

      - name: Upload SAL v1.11 derived semantic lineage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v111-derived-semantic-lineage-closure-${{ github.run_id }}
          path: sal-derived-semantic-lineage-evidence/
          if-no-files-found: error
          retention-days: 90
