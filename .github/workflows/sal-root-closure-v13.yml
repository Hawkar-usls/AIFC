name: AIFC SAL v1.3 Root Closure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  sal-v13-root-closure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Confirm exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run SAL v1.3 root-closure conformance
        shell: bash
        run: |
          mkdir -p sal-root-closure-evidence
          python tools/check_sal_root_closure_v13.py | tee sal-root-closure-evidence/sal-root-closure-v13.txt
          sha256sum sal-root-closure-evidence/sal-root-closure-v13.txt | tee sal-root-closure-evidence/sal-root-closure-v13.sha256

      - name: Upload SAL root-closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v13-root-closure-${{ github.run_id }}
          path: sal-root-closure-evidence/
          if-no-files-found: error
          retention-days: 90
