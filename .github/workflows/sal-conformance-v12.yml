name: AIFC SAL v1.2 Conformance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sal-v12-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Confirm exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Install hash-locked verifier runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run SAL v1.2 conformance
        run: |
          mkdir -p sal-conformance-evidence
          python tools/check_sal_conformance_v12.py | tee sal-conformance-evidence/sal-conformance-v12.txt
          sha256sum sal-conformance-evidence/sal-conformance-v12.txt | tee sal-conformance-evidence/sal-conformance-v12.sha256

      - name: Upload SAL conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v12-conformance-${{ github.run_id }}
          path: sal-conformance-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
