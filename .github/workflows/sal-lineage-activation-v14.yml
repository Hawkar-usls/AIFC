name: AIFC SAL v1.4 Lineage Activation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  sal-v14-lineage-activation:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and historical objects
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 7e58b47398fe585b24db6304ee6122871095d668^{commit}
          git cat-file -e eeee61c6143cde1bea64c643def6eaec461e7aa2^{commit}
          echo "HISTORICAL_GIT_OBJECTS_AVAILABLE = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run SAL v1.4 inductive lineage activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sal-lineage-activation-evidence
          python tools/check_sal_lineage_activation_v14.py | tee sal-lineage-activation-evidence/sal-lineage-activation-v14.txt
          sha256sum sal-lineage-activation-evidence/sal-lineage-activation-v14.txt | tee sal-lineage-activation-evidence/sal-lineage-activation-v14.sha256

      - name: Upload SAL v1.4 lineage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v14-lineage-activation-${{ github.run_id }}
          path: sal-lineage-activation-evidence/
          if-no-files-found: error
          retention-days: 90
