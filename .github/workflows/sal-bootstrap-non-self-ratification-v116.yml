name: AIFC SAL v1.16 Bootstrap Non-Self-Ratification Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v116-bootstrap-non-self-ratification-boundary:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and immutable v1.15 predecessor tree
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 54a689a73df5d81ac161e848ffd867f3bdf8a15f^{commit}
          test "$(git rev-parse 54a689a73df5d81ac161e848ffd867f3bdf8a15f^{tree})" = "be81ec868103439d75860391cf50d9cd59f2413c"
          echo "SAL_V116_PREDECESSOR_TREE = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Capture non-self-ratification implementation identity
        shell: bash
        run: |
          mkdir -p sal-bootstrap-non-self-ratification-evidence
          impl=reference/verifier/bootstrap_non_self_ratification_boundary_v1.py
          echo "BOOTSTRAP_NON_SELF_RATIFICATION_IMPLEMENTATION_PATH = $impl" | tee sal-bootstrap-non-self-ratification-evidence/implementation-identity.txt
          echo "BOOTSTRAP_NON_SELF_RATIFICATION_IMPLEMENTATION_GIT_BLOB_SHA1 = $(git hash-object "$impl")" | tee -a sal-bootstrap-non-self-ratification-evidence/implementation-identity.txt
          echo "BOOTSTRAP_NON_SELF_RATIFICATION_IMPLEMENTATION_RAW_SHA256 = $(sha256sum "$impl" | awk '{print $1}')" | tee -a sal-bootstrap-non-self-ratification-evidence/implementation-identity.txt

      - name: Run SAL v1.16 adversarial unit module
        shell: bash
        run: |
          python -m unittest discover -s reference/tests -p 'test_sal_bootstrap_non_self_ratification_v116.py' -v 2>&1 | tee sal-bootstrap-non-self-ratification-evidence/sal-v116-unit-tests.txt

      - name: Run attested SAL v1.16 non-self-ratification checker
        shell: bash
        run: |
          python reference/verifier/sal_bootstrap_non_self_ratification_checker_v116.py | tee sal-bootstrap-non-self-ratification-evidence/sal-bootstrap-non-self-ratification-v116.txt
          sha256sum sal-bootstrap-non-self-ratification-evidence/sal-bootstrap-non-self-ratification-v116.txt | tee sal-bootstrap-non-self-ratification-evidence/sal-bootstrap-non-self-ratification-v116.sha256

      - name: Upload SAL v1.16 non-self-ratification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v116-bootstrap-non-self-ratification-${{ github.run_id }}
          path: sal-bootstrap-non-self-ratification-evidence/
          if-no-files-found: error
          retention-days: 90
