name: AIFC SAL v1.11h Derived Semantic Lineage Edge Binding

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v111h-derived-semantic-lineage-edge-binding:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and immutable v1.11 lineage vertices
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 847bc6487351ebd45f2ecd6bd5189f532eb99d8d^{commit}
          test "$(git ls-tree HEAD -- conformance/AIFC-SEMANTIC-DERIVATION-PROFILE-v1.json | awk '{print $3}')" = "37cab9a72d836b5fd3cbefbbf6e51e41abb140d2"
          test "$(git ls-tree HEAD -- conformance/AIFC-SEMANTIC-DERIVATION-PROOF-v1.json | awk '{print $3}')" = "d582c0599226d50bddba1e548c28aaf720dac070"
          test "$(git ls-tree HEAD -- conformance/AIFC-DERIVATION-LEAF-MANIFEST-v1.json | awk '{print $3}')" = "d871a69b86f2951a2800df8ecad2f2ba4e0f73cf"
          test "$(git ls-tree HEAD -- conformance/AIFC-CANONICAL-SEMANTIC-DEPENDENCY-GRAPH-v1.json | awk '{print $3}')" = "f7553ad50c45f75a484163266b2be74d8ed99892"
          test "$(git ls-tree HEAD -- conformance/AIFC-BRIDGE-DERIVED-SEMANTIC-OBJECT-v2.json | awk '{print $3}')" = "759f67300af84bba3060cf348aa766b15500933f"
          test "$(git ls-tree HEAD -- conformance/AIFC-ENTAILMENT-QUESTION-v1.json | awk '{print $3}')" = "592df1a8147d678ddfd6229fd64f79a681a554f6"
          echo "SAL_V111H_VERTEX_MEMBERSHIP = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run attested SAL v1.11h lineage-edge checker
        shell: bash
        run: |
          mkdir -p sal-derived-semantic-lineage-edge-evidence
          python reference/verifier/sal_derived_semantic_lineage_edge_checker_v111h.py | tee sal-derived-semantic-lineage-edge-evidence/sal-derived-semantic-lineage-edge-v111h.txt
          sha256sum sal-derived-semantic-lineage-edge-evidence/sal-derived-semantic-lineage-edge-v111h.txt | tee sal-derived-semantic-lineage-edge-evidence/sal-derived-semantic-lineage-edge-v111h.sha256

      - name: Upload SAL v1.11h lineage-edge evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v111h-derived-semantic-lineage-edge-binding-${{ github.run_id }}
          path: sal-derived-semantic-lineage-edge-evidence/
          if-no-files-found: error
          retention-days: 90
