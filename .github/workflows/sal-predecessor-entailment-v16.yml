name: AIFC SAL v1.6 Predecessor Semantic Entailment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sal-v16-predecessor-entailment:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact tested source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact checkout and historical authority objects
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_COMMIT_SHA = $actual"
          test "$actual" = "$EXPECTED_SHA"
          git cat-file -e 908de7afddcf9f72c98c2b3fb696a41be1e438e0^{commit}
          git cat-file -e 7e58b47398fe585b24db6304ee6122871095d668^{commit}
          git cat-file -e eeee61c6143cde1bea64c643def6eaec461e7aa2^{commit}
          git cat-file -e 56370d60f43feca8b82871d30a0b71acf1409a2f^{commit}
          git cat-file -e 5afc09e9a965f8b20d0b07059f1ff753aad920b7^{commit}
          echo "SAL_V16_AUTHORITY_HISTORY_OBJECTS_AVAILABLE = PASS"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Install hash-locked verifier runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r reference/verifier/requirements.lock.txt

      - name: Run SAL v1.6 predecessor semantic entailment audit
        shell: bash
        run: |
          mkdir -p sal-predecessor-entailment-evidence
          python tools/check_sal_predecessor_entailment_v16.py | tee sal-predecessor-entailment-evidence/sal-predecessor-entailment-v16.txt
          sha256sum sal-predecessor-entailment-evidence/sal-predecessor-entailment-v16.txt | tee sal-predecessor-entailment-evidence/sal-predecessor-entailment-v16.sha256

      - name: Upload SAL v1.6 predecessor entailment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sal-v16-predecessor-entailment-${{ github.run_id }}
          path: sal-predecessor-entailment-evidence/
          if-no-files-found: error
          retention-days: 90
